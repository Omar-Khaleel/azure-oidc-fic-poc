name: Azure OIDC FIC PoC

on:
  workflow_dispatch:
  push:
    branches:
      - fic-poc-1778652791

permissions:
  id-token: write
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest

    steps:
      - name: Print non-secret context
        shell: bash
        env:
          AZURE_CLIENT_ID_VAR: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID_VAR: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID_VAR: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          KV_SECRET_URL_VAR: ${{ vars.KV_SECRET_URL }}
        run: |
          set -euo pipefail
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "AZURE_CLIENT_ID_SET=$([ -n "$AZURE_CLIENT_ID_VAR" ] && echo true || echo false)"
          echo "AZURE_TENANT_ID_SET=$([ -n "$AZURE_TENANT_ID_VAR" ] && echo true || echo false)"
          echo "AZURE_SUBSCRIPTION_ID_SET=$([ -n "$AZURE_SUBSCRIPTION_ID_VAR" ] && echo true || echo false)"
          echo "KV_SECRET_URL_SET=$([ -n "$KV_SECRET_URL_VAR" ] && echo true || echo false)"

      - name: Print GitHub OIDC subject without token
        shell: bash
        run: |
          set -euo pipefail

          curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            -o oidc-response.json

          python3 -c 'import json; print(json.load(open("oidc-response.json"))["value"])' > oidc-token.txt

          python3 -c 'import base64,json; token=open("oidc-token.txt").read().strip(); payload=token.split(".")[1]; payload += "=" * (-len(payload) % 4); data=json.loads(base64.urlsafe_b64decode(payload)); print("GITHUB_OIDC_ISSUER=" + data.get("iss","")); print("GITHUB_OIDC_SUBJECT=" + data.get("sub","")); print("GITHUB_OIDC_AUDIENCE=" + str(data.get("aud",""))); print("GITHUB_OIDC_TOKEN_PRINTED=false")'

          rm -f oidc-token.txt oidc-response.json

      - name: Azure login via GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity without secrets
        shell: bash
        run: |
          set -euo pipefail
          az account show --query '{tenantId:tenantId, subscriptionId:id, user:user}' -o json
          echo "AZURE_LOGIN_SUCCEEDED=true"

      - name: Read dummy Key Vault secret without printing it
        shell: bash
        env:
          KV_SECRET_URL: ${{ vars.KV_SECRET_URL }}
        run: |
          set -euo pipefail

          echo "GITHUB_OIDC_LOGIN_SUCCEEDED=true"

          kv_token="$(az account get-access-token \
            --resource https://vault.azure.net \
            --query accessToken \
            -o tsv)"

          echo "KEYVAULT_ACCESS_TOKEN_LENGTH_GT_ZERO=$([ -n "$kv_token" ] && echo true || echo false)"
          echo "KEYVAULT_ACCESS_TOKEN_VALUE_PRINTED=false"

          curl -fsS \
            -H "Authorization: Bearer $kv_token" \
            "$KV_SECRET_URL" \
            -o kv-secret.json

          python3 -c 'import json,hashlib; v=json.load(open("kv-secret.json")).get("value",""); print("KEYVAULT_SECRET_READ_SUCCEEDED=" + str(bool(v)).lower()); print("KEYVAULT_SECRET_LENGTH_GT_ZERO=" + str(len(v) > 0).lower()); print("KEYVAULT_SECRET_SHA256=" + hashlib.sha256(v.encode()).hexdigest()); print("KEYVAULT_SECRET_VALUE_PRINTED=false")'

          rm -f kv-secret.json
